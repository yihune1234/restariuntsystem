# Render Blueprint — Tasty Station POS monorepo
#
# Deploys two services from this single repository:
#   1. backend  — Node API + Socket.IO web service (rootDir: Cafeteria-Management-System-Backend)
#   2. frontend — Vite React SPA served as a static site (rootDir: frontend)
#
# Using rootDir means Render installs each service's OWN dependencies and runs
# each service's OWN scripts — no root-level dependency installation needed.
#
# After pushing, in Render: New -> Blueprint -> select this repository.
# Required environment variables are declared below; fill their sync-false
# values in the Render dashboard (never commit real secrets).

services:
  # ------------------------------------------------------------------
  # Backend API (Express + Socket.IO)
  # ------------------------------------------------------------------
  - type: web
    name: tastystation-backend
    runtime: node
    rootDir: Cafeteria-Management-System-Backend
    plan: free
    region: oregon
    buildCommand: npm ci
    # Render injects PORT; the server reads config.port from it.
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false          # Atlas connection string (secret)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CUSTOMER_SESSION_EXPIRES_IN_HOURS
        value: 6
      # Cloudinary (optional — uploads fall back to local disk when unset)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Chapa payment gateway
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: CHAPA_BASE_URL
        value: https://api.chapa.co/v1
      - key: CHAPA_WEBHOOK_SECRET
        sync: false
      # CORS — filled after the frontend URL is known (see frontend service)
      - key: CLIENT_URL
        sync: false
      - key: SOCKET_CORS_ORIGIN
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 1000

  # ------------------------------------------------------------------
  # Frontend (Vite React SPA + PWA, static hosting)
  # ------------------------------------------------------------------
  - type: web
    name: tastystation-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    routes:
      # SPA fallback: serve index.html for client-side routes
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set to the backend service's onRender.com URL after first deploy
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
      - key: VITE_CLIENT_URL
        sync: false
      - key: VITE_ENVIRONMENT
        value: production
    headers:
      # Long-cache hashed assets
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
