version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paperless_restaurant_backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/paperless_restaurant?replicaSet=rs0
      - JWT_ACCESS_SECRET=prod_jwt_super_secret_access_key_2026_min32chars
      - JWT_REFRESH_SECRET=prod_jwt_super_secret_refresh_key_2026_min32chars
      - CHAPA_SECRET_KEY=CHASECK_TEST-sample_chapa_secret_key
      - CLIENT_URL=http://localhost:3000
      - SOCKET_CORS_ORIGIN=http://localhost:3000,http://localhost:5173
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    container_name: paperless_restaurant_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    command: ['--replSet', 'rs0', '--bind_ip_all']

volumes:
  mongo_data:
